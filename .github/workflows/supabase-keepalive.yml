name: Supabase Keepalive

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 */2 * *"

permissions:
  contents: read

jobs:
  fiamma-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ping Fiamma Supabase catalog
        run: node scripts/supabase_keepalive_check.mjs
